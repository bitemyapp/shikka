[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shikka"
version = "0.1.0"
description = "Cargo-authoritative Rust builds with Buck2 and optional NativeLink"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
shikka = "shikka.cli:main"

[tool.setuptools.package-data]
shikka = ["resources/*", "resources/.buckconfig"]
